[env:ProjectConfig]
platform = espressif8266
board = esp12e
board_build.f_cpu = 80000000L
framework = arduino
board_build.filesystem = littlefs
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.11
	fastled/FastLED@^3.9.2
	adafruit/Adafruit NeoMatrix@^1.3.3
	bblanchon/ArduinoJson@^7.2.0
	marvinroger/ESP8266TrueRandom@^1.0
	LittleFS
	ESP8266WiFi
	ESP8266WebServer
build_src_filter = 
	+<../src/>
	+<../src/modes>
build_flags = -Iinc -Iinc/modes